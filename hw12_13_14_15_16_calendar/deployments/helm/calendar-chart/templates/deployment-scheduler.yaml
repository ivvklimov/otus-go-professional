apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-scheduler
  labels:
    app: calendar
    release: {{ .Release.Name }}
    component: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: calendar
      release: {{ .Release.Name }}
      component: scheduler
  template:
    metadata:
      labels:
        app: calendar
        release: {{ .Release.Name }}
        component: scheduler
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: scheduler
          image: "{{ .Values.scheduler.image.repository }}:{{ .Values.scheduler.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: DB_HOST
              value: "{{ .Release.Name }}-postgres"
            - name: DB_PORT
              value: "{{ .Values.postgresql.port }}"
            - name: DB_USER
              value: {{ .Values.postgresql.user | quote }}
            - name: DB_PASSWORD
              value: {{ .Values.postgresql.password | quote }}
            - name: DB_NAME
              value: {{ .Values.postgresql.database | quote }}
            - name: DB_SSLMODE
              value: "disable"
            - name: RMQ_URL
              value: "amqp://{{ .Values.rabbitmq.user }}:{{ .Values.rabbitmq.password }}@{{ .Release.Name }}-rabbitmq:{{ .Values.rabbitmq.amqpPort }}/"
            {{- range $key, $val := .Values.scheduler.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          resources: {{- toYaml .Values.scheduler.resources | nindent 12 }}
